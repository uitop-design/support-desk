services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "5432:5432"
    volumes:
      - desk-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - desk-redis:/data

volumes:
  desk-db:
  desk-redis:
